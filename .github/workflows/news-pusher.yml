name: news-pusher

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-pusher
  cancel-in-progress: false

jobs:
  push-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run news pusher
        env:
          DD_WEBHOOK: ${{ secrets.DD_WEBHOOK }}
          DD_SECRET: ${{ secrets.DD_SECRET }}
        run: python3 news_pusher.py
      - name: Commit dedup state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            if git diff --cached --quiet; then
              echo "state unchanged, skip commit"
            else
              git commit -m "update push state"
              git push
            fi
          else
            echo "state.json missing, skip commit"
          fi
